spring:
  application:
    name: gateway-test

  main:
    web-application-type: reactive

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/realms/test
          jwk-set-uri: http://localhost:9999/realms/test/protocol/openid-connect/certs

  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s

      routes:
        - id: session-manager
          uri: http://localhost:8082
          predicates:
            - Path=/api/sessions/**

        - id: billing-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/billing/**

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**

        - id: signaling-ws
          uri: http://localhost:8085
          predicates:
            - Path=/signaling/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, metrics
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    com.cloudgaming.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600