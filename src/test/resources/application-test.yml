spring:
  application:
    name: gateway-test

  main:
    web-application-type: reactive

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/realms/test
          jwk-set-uri: http://localhost:9999/realms/test/protocol/openid-connect/certs

  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s

      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**

        - id: session-manager
          uri: http://localhost:8082
          predicates:
            - Path=/api/sessions/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/payments/**

        - id: stripe-webhook
          uri: http://localhost:8083
          predicates:
            - Path=/api/webhooks/stripe/**

        - id: yookassa-webhook
          uri: http://localhost:8083
          predicates:
            - Path=/api/webhooks/yookassa/**

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**

        - id: signaling-ws
          uri: ws://localhost:8085
          predicates:
            - Path=/api/v1/signaling/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, metrics
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  health:
    redis:
      enabled: false

logging:
  level:
    com.cloudgaming.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

  rate-limit:
    sessions:
      replenish-rate: 10
      burst-capacity: 20
    payments:
      replenish-rate: 5
      burst-capacity: 10
