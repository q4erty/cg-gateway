server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: ${GATEWAY_APP_NAME:gateway}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}

      routes:
        - id: user-service
          uri: ${USER_SERVICE_URI}
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userCircuitBreaker
                fallbackUri: forward:/fallback/user

        - id: session-manager
          uri: ${SESSION_MANAGER_URI}
          predicates:
            - Path=/api/sessions/**
          filters:
            - name: CircuitBreaker
              args:
                name: sessionCircuitBreaker
                fallbackUri: forward:/fallback/session
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_SESSIONS_REPLENISH:10}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_SESSIONS_BURST:20}
                key-resolver: "#{@userKeyResolver}"

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI}
          predicates:
            - Path=/api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/fallback/payment
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_PAYMENTS_REPLENISH:5}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_PAYMENTS_BURST:10}
                key-resolver: "#{@userKeyResolver}"

        - id: stripe-webhook
          uri: ${PAYMENT_SERVICE_URI}
          predicates:
            - Path=/api/webhooks/stripe/**

        - id: yookassa-webhook
          uri: ${PAYMENT_SERVICE_URI}
          predicates:
            - Path=/api/webhooks/yookassa/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI}
          predicates:
            - Path=/api/notifications/**

        - id: signaling-ws
          uri: lb:ws://${SIGNALING_SERVICE_NAME:signaling-service}
          predicates:
            - Path=/api/v1/signaling/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    com.cloudgaming.gateway: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

  rate-limit:
    sessions:
      replenish-rate: ${RATE_LIMIT_SESSIONS_REPLENISH:10}
      burst-capacity: ${RATE_LIMIT_SESSIONS_BURST:20}
    payments:
      replenish-rate: ${RATE_LIMIT_PAYMENTS_REPLENISH:5}
      burst-capacity: ${RATE_LIMIT_PAYMENTS_BURST:10}
